<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!--faz a página usar a largura real da tela do aparelho, necessário para o @media funcionar no celular-->
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">

    <!--Título da página, que fica visível na aba do navegador-->
    <title> CATÁLOGO DE PRODUTOS  </title>

    <!--head e link  para conectar o CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--body para criar o header (cabeçalho) visível na pág-->
    <header class="topo">
        <h1> CATÁLOGO DE PRODUTOS </h1>
    </header>

    <!--Main: Delimitar o conteúdo principal da pág-->
    <main>
        <!--section para separar o conteúdo em blocos, por assunto -->
        <section class="lista-produtos">
            <h2> Lista de Produtos</h2>

            <!-- lista vazia que vai identificar para o js e a API, em qual lugar que deve alocar os produtos da requisição-->
            <ul id="produtos"> </ul>   
        </section>

        <!--section para separar o conteúdo em blocos-->
        <section class="painel-detalhes">
            <h2> Painel Detalhes </h2>

            <!-- lista vazia que vai identificar para o js e a API, em qual lugar que deve alocar os produtos da requisição-->
            <ul id="detalhes"></ul>   
        </section>
    </main>

    <!--Linkamos o JS ao HTML-->
    <script src="script.js"> </script> 
</body>
</html>
